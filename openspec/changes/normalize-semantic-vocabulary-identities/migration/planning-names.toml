[[accepted_decision]]
old = "D-001"
name = "DiskWeave is a portable parity block engine below conventional per-member filesystems, not a custom filesystem."

[[accepted_decision]]
old = "D-002"
name = "Each healthy data payload remains an ordinary independently readable image."

[[accepted_decision]]
old = "D-003"
name = "Data members contain no required DiskWeave metadata, sidecar, or partition."

[[accepted_decision]]
old = "D-004"
name = "ublk, FSKit, io_uring, SQLite, `procmachines`, runtimes, codecs, and checksum crates remain behind replaceable seams."

[[accepted_decision]]
old = "D-005"
name = "Array, slot, physical store, coding position, assignment, and topology epoch identities are distinct."

[[accepted_decision]]
old = "D-006"
name = "Identity uses multiple observations; clone/assignment ambiguity blocks writes."

[[accepted_decision]]
old = "D-007"
name = "Logical transaction and backend resource lifetimes are separate."

[[accepted_decision]]
old = "D-008"
name = "Write-recovery coverage precedes data/parity writes; persistence evidence precedes recovery CLEAN."

[[accepted_decision]]
old = "D-009"
name = "Data and every parity role are checksum targets; parity cleanliness and integrity coverage are separate."

[[accepted_decision]]
old = "D-010"
name = "Checksum validity is generation-bound and requires matching persistence evidence."

[[accepted_decision]]
old = "D-011"
name = "Sampling never establishes `CLEAN`."

[[accepted_decision]]
old = "D-012"
name = "Automatic repair requires a unique result from verified-good evidence and target readback."

[[accepted_decision]]
old = "D-013"
name = "`array.sqlite3` loss never destroys intact data; all-data recovery can establish a new topology/baseline."

[[accepted_decision]]
old = "D-014"
name = "The first production release prohibits writes when a required data/parity role is unavailable."

[[accepted_decision]]
old = "D-015"
name = "Runtime and persistent granularities remain independent."

[[accepted_decision]]
old = "D-016"
name = "Full verification is distinct from parity rewrite; matching ranges require no writes."

[[accepted_decision]]
old = "D-017"
name = "Backing and exported endpoints cannot alias while active."

[[accepted_decision]]
old = "D-018"
name = "Simulator, file-backed, macOS, Linux, and hardware evidence establish different claims."

[[accepted_decision]]
old = "D-019"
name = "No stable format without independent recovery tools and migration evidence."

[[accepted_decision]]
old = "D-020"
name = "Routine reversible implementation choices are delegated to agents."

[[accepted_decision]]
old = "D-021"
name = "Consequential work remains owned until final resolution, reconciliation, or durable transfer of recovery responsibility."

[[accepted_decision]]
old = "D-022"
name = "Task, future, or frontend disappearance is not rollback or a final result."

[[accepted_decision]]
old = "D-023"
name = "`dwv-sim` remains the domain simulator; general deterministic I/O runtimes only complement it."

[[accepted_decision]]
old = "D-024"
name = "Normalized semantic traces are the common portable regression artifact; producer witnesses remain tool-scoped and retained."

[[accepted_decision]]
old = "D-025"
name = "Verification tools may not force a general runtime/effect system, transaction rewrite, CLI redesign, or format change."

[[accepted_decision]]
old = "D-026"
name = "The primary abstract model is independent of production Rust, records bounds and fairness, translates counterexamples to simulator scenarios, and uses the maintained write-recovery lifecycle model as delegated authority."

[[accepted_decision]]
old = "D-027"
name = "Persistence durability and logical protection policy are distinct; current `BlockRequest` carries only durability semantics."

[[accepted_decision]]
old = "D-028"
name = "Physical stores are role-neutral; logical roles and coding positions are topology bindings."

[[accepted_decision]]
old = "D-029"
name = "Codec primitives consume explicit profiles/positions/shards and are independent of topology, stores, and placement."

[[accepted_decision]]
old = "D-030"
name = "Operation-slot/executor ownership is role-neutral."

[[accepted_decision]]
old = "D-031"
name = "The low-level durable/volatile/completion media model is independent of parity/SQLite policy; a physical crate split is optional."

[[accepted_decision]]
old = "D-032"
name = "Namespace placement is deterministic whole-file logical-slot selection, not an extent allocator or per-object protection mechanism."

[[accepted_decision]]
old = "D-033"
name = "Persistent formats identify the DiskWeave block-parity family and reject incompatible interpretation."

[[accepted_decision]]
old = "D-034"
name = "No speculative allocator, object graph, universal transaction framework, protection API, or placeholder crate is introduced without a concrete accepted consumer."

[[accepted_decision]]
old = "D-035"
name = "Any product that owns filesystem namespace or allocation and changes the recoverability contract requires a separate approved architecture and format; it is not a hidden mode of DiskWeave block parity."

