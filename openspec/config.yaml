schema: spec-driven

rules:
  proposal:
    - Use `os-NNN-*` only for the matching `OS-NNN` node in the active architecture roadmap, with exactly one `<!-- dwv:roadmap-node OS-NNN -->` marker; numbered planning documents never allocate OpenSpec IDs.
  specs:
    - Preserve stable `req.*` identities when their semantics are unchanged.
    - When adding behavior, prefer one behavior per requirement; do not compress distinct rules into one sentence.
    - For MODIFIED requirements, clarify touched prose when semantics-preserving; do not broaden the change for cleanup, and surface semantic or ownership issues for reconciliation.

operations:
  apply:
    guidance:
      - Treat current canonical specs as the owner of current required behavior and surface contradictions before implementation.
  archive:
    guidance:
      - Preserve stable req.* identities and summarize any canonical requirement changes before archiving.
      - Never reuse a retained numeric identity for another change; later corrections use descriptive unnumbered IDs.
