[package]
name = "diskweave"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "dwv"
path = "src/main.rs"
[workspace]
members = [
    "crates/dwv-core",
    "crates/dwv-codec",
    "crates/dwv-store",
    "crates/dwv-sim",
    "crates/dwv-recovery",
    "crates/dwv-recovery-sqlite",
    "crates/dwv-transaction-ref",
    "crates/dwv-store-file",
    "crates/dwv-service",
    "crates/dwv-verify",
    "crates/dwv-format",
    "crates/dwv-transaction-proc",
    "crates/dwv-trace",
    "xtask",
]
resolver = "2"

[dependencies]
blake3 = "1"
dwv-codec = { path = "crates/dwv-codec" }
dwv-core = { path = "crates/dwv-core" }
dwv-recovery = { path = "crates/dwv-recovery" }
dwv-recovery-sqlite = { path = "crates/dwv-recovery-sqlite" }
dwv-format = { path = "crates/dwv-format" }
dwv-service = { path = "crates/dwv-service" }
dwv-sim = { path = "crates/dwv-sim" }
dwv-store = { path = "crates/dwv-store" }
dwv-store-file = { path = "crates/dwv-store-file" }
dwv-trace = { path = "crates/dwv-trace" }
dwv-verify = { path = "crates/dwv-verify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
