[[entries.sections]]
heading = "Inspect the disposable layout"
focus = "Show ordinary member payload files, parity, replacement, reference, envelopes, and recovery control state before running commands."
must_answer = ["Which files contain ordinary payload bytes?", "Which files are disposable control or evidence state?"]
requirements = [
  "req.architecture-contract.diskweave-protects-conventional-member-images-at-block-level",
  "req.healthy-portable-io.portable-members-remain-ordinary-and-control-state-is-disposable"
]
scenarios = []
non_claims = ["The layout is not a mounted filesystem or production virtual disk."]

[[entries.sections]]
heading = "Run the implemented journey"
focus = "Present initialization, healthy I/O, degraded read, separate-target rebuild, exhaustive verification, and trace replay in operational order."
must_answer = ["Which real crates and paths execute?", "Which outputs prove each stage completed?"]
requirements = [
  "req.macos-demo-cli.the-offline-demo-exercises-healthy-and-recoverable-behavior",
  "req.normalized-block-semantics.portable-evidence-does-not-imply-platform-certification"
]
scenarios = ["scenario.normalized-recovery"]
non_claims = ["A successful demo does not prove an unavailable frontend or physical device path."]

[[entries.sections]]
heading = "Map observations to evidence"
focus = "Connect each command result to scenario and assurance artifacts with exact evidence tier and non-claims."
must_answer = ["Where can a reader inspect the trace and assurance record?", "What tier does each result reach?"]
requirements = ["req.evidence-boundaries.evidence-scope-is-explicit"]
scenarios = ["scenario.normalized-recovery"]
non_claims = ["Evidence strength does not transfer across platform boundaries."]

[[entries.sections]]
heading = "State what is still missing"
focus = "Close with frontend, installation, live mount, hardware durability, and certification gaps plus their owning work."
must_answer = ["What can actually be used now?", "Which production claims remain unsupported?"]
requirements = [
  "req.architecture-contract.portable-semantics-are-independent-of-implementation-mechanisms",
  "req.normalized-block-semantics.portable-evidence-does-not-imply-platform-certification",
  "req.evidence-boundaries.evidence-scope-is-explicit"
]
scenarios = []
non_claims = ["Portable file-backed behavior is not Linux, macOS bridge, or hardware certification."]


