[package]
name = "dwv-recovery"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
blake3 = "1"
dwv-core = { path = "../dwv-core" }
dwv-store = { path = "../dwv-store" }
serde = { version = "1", features = ["derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
