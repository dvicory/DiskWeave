[package]
name = "dwv-transaction-ref"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
dwv-core = { path = "../dwv-core" }
dwv-recovery = { path = "../dwv-recovery" }
dwv-store = { path = "../dwv-store" }

[dev-dependencies]
quint-connect = "0.1.2"
itf = "0.4"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
dwv-sim = { path = "../dwv-sim" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
