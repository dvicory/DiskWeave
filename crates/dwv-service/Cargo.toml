[package]
name = "dwv-service"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blake3 = "1"
dwv-codec = { path = "../dwv-codec" }
dwv-core = { path = "../dwv-core" }
dwv-recovery = { path = "../dwv-recovery" }
dwv-store = { path = "../dwv-store" }
dwv-transaction-ref = { path = "../dwv-transaction-ref" }
dwv-verify = { path = "../dwv-verify" }

[dev-dependencies]
anyhow = "1"
dwv-recovery = { path = "../dwv-recovery" }
dwv-store-file = { path = "../dwv-store-file" }
itf = "0.4"
quint-connect = "0.1.2"
serde = { version = "1", features = ["derive"] }
proptest = "1.11"
proptest-state-machine = "0.8"
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
