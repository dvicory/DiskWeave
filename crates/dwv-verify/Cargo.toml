[package]
name = "dwv-verify"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "dwv-independent-parity"
path = "src/independent_parity.rs"

[dependencies]
dwv-codec = { path = "../dwv-codec" }
dwv-core = { path = "../dwv-core" }
dwv-recovery = { path = "../dwv-recovery" }
dwv-store = { path = "../dwv-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
