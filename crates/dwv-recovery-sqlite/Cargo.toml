[package]
name = "dwv-recovery-sqlite"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dwv-recovery-inspect"
path = "src/recovery_inspect.rs"

[dependencies]
blake3 = "1"
dwv-core = { path = "../dwv-core" }
dwv-recovery = { path = "../dwv-recovery" }
dwv-store = { path = "../dwv-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
